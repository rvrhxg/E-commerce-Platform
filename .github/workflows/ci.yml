name: Python commerce acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U test -d commerce_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock
      - run: pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://test:isolated-ci-only@localhost:5432/commerce_test
      - run: node --check public/app.js
      - run: docker build -t atelier-test .
      - run: python -m scripts.container_smoke
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://test:isolated-ci-only@localhost:5432/commerce_test
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-browser-screenshots
          path: screenshots/
