services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atelier
      POSTGRES_DB: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - atelier-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 3s
      retries: 20
  store:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://atelier:${POSTGRES_PASSWORD}@db:5432/atelier
      APP_ORIGIN: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  atelier-db:
