[project]
name = "atelier-commerce"
version = "0.2.0"
description = "Independent portfolio e-commerce platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.17,<1", "mypy>=2.4,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["app/catalog.py", "app/observability.py", "app/sqlite_backup.py", "app/pg_backup.py"]
strict = true
